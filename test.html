<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veri testi</title>
<style>
:root{color-scheme:light dark}
body{font:15px/1.5 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:16px}
input,button{font:inherit;padding:10px;margin:4px 4px 4px 0}
pre{white-space:pre-wrap;word-break:break-all;background:rgba(127,127,127,.15);padding:12px;border-radius:8px;max-height:50vh;overflow:auto;font-size:12px}
</style>
</head>
<body>
<h1>Veri testi</h1>
<p>Erişim kodunu yaz, bir düğmeye bas, sonra <b>Tam veriyi indir</b> ile dosyayı kaydedip Claude sohbetine ek olarak yükle.</p>
<input id="app" type="password" placeholder="Erişim kodu"><input id="code" value="ECA" placeholder="Fon kodu"><br>
<button data-e="list">Fon listesi (1 aylık getiriye göre)</button>
<button data-e="bm">Mevduat kıyası</button>
<button data-e="fin">Hisselerin finansalları</button>
<button id="dl">Tam veriyi indir (.txt)</button>
<pre id="out">Henüz bir şey seçilmedi.</pre>
<script>
const E = {
  list: "/funds?sort=return_1m&dir=desc&limit=25",
  bm: "/funds/{c}/timeseries?include=benchmark",
  fin: "/funds/{c}/portfolio?include=fundamentals,analysts"
};
const out = document.getElementById("out");
let full = "", name = "veri";
function trim(v) {
  if (Array.isArray(v)) { const a = v.slice(0, 2).map(trim); if (v.length > 2) a.push("… toplam " + v.length + " öğe"); return a; }
  if (v && typeof v === "object") { const o = {}; for (const k in v) o[k] = trim(v[k]); return o; }
  if (typeof v === "string" && v.length > 80) return v.slice(0, 80) + "…";
  return v;
}
document.querySelectorAll("button[data-e]").forEach(b => b.onclick = async () => {
  const c = document.getElementById("code").value.trim().toUpperCase();
  const [path, qs] = E[b.dataset.e].replace("{c}", c).split("?");
  out.textContent = "Yükleniyor…"; name = b.dataset.e + "-" + c;
  try {
    const r = await fetch("/api/fonoloji?path=" + encodeURIComponent(path) + (qs ? "&" + qs : ""), { headers: { "x-app-code": document.getElementById("app").value } });
    const t = await r.text(); full = "HTTP " + r.status + "\n" + t;
    let body = t; try { body = JSON.stringify(trim(JSON.parse(t)), null, 1); } catch (e) { body = t.slice(0, 2000); }
    out.textContent = "HTTP " + r.status + " (özet)\n" + body;
  } catch (e) { out.textContent = "Hata: " + e.message; full = ""; }
});
document.getElementById("dl").onclick = () => {
  if (!full) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([full], { type: "text/plain" }));
  a.download = name + ".txt"; a.click();
};
</script>
</body>
</html>
